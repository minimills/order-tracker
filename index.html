<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BMM Orders" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Belfast Mini Mills – Orders</title>
    <script>
      // The theme chosen in Settings (kept in this browser), set before the page draws.
      try {
        var t = localStorage.getItem('bmm.theme') || 'system'
        var c = t === 'glass' ? localStorage.getItem('bmm.glassbase') || 'system' : t
        var r = document.documentElement
        if (c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) r.classList.add('dark')
        if (t === 'glass') {
          r.classList.add('glass')
          if (localStorage.getItem('bmm.glasslite') === 'slow' || matchMedia('(prefers-reduced-transparency: reduce), (prefers-reduced-motion: reduce), (prefers-contrast: more)').matches) r.classList.add('glass-lite')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
